version: 2

models:
  - name: int_sessions
    description: One row per session with device, country and marketing channel.
    columns:
      - name: session_key
        data_tests: [unique, not_null]
      - name: channel
        description: Simplified channel grouping based on traffic source/medium.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Organic Search', 'Paid Search', 'Referral', 'Direct', 'Unknown', 'Other']

  - name: int_funnel_steps
    description: Funnel steps reached by each session (1 = reached).
    columns:
      - name: session_key
        data_tests: [unique, not_null]

  - name: int_daily_exchange_rates
    description: Daily exchange rates for every calendar day, forward-filled on weekends.
    columns:
      - name: rate_date
        data_tests: [unique, not_null]
      - name: usd_to_eur
        data_tests: [not_null]
