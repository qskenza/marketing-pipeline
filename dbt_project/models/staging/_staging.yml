version: 2

models:
  - name: stg_ga4__events
    description: One row per GA4 event from the Google Merchandise Store sample, flattened.
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: event_name
        description: GA4 event type (page_view, view_item, add_to_cart, purchase...).
        data_tests: [not_null]
      - name: session_key
        description: user_pseudo_id + ga_session_id, unique per session.
      - name: traffic_source
        description: First-touch acquisition source of the user.
      - name: purchase_revenue_usd
        description: Order revenue in USD (only on purchase events).

  - name: stg_exchange_rates
    description: Daily USD exchange rates pivoted into columns (business days only).
    columns:
      - name: rate_date
        data_tests: [unique, not_null]
      - name: usd_to_eur
        data_tests: [not_null]
