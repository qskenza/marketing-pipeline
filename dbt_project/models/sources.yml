version: 2

sources:
  - name: ga4
    description: Public GA4 export of the Google Merchandise Store (obfuscated sample).
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: One sharded table per day (events_YYYYMMDD), Nov 2020 to Jan 2021.

  - name: raw
    description: Raw data loaded by our Python ingestion script.
    schema: "{{ env_var('BQ_RAW_DATASET', 'mkt_raw') }}"
    tables:
      - name: exchange_rates
        identifier: raw_exchange_rates
        description: Daily USD exchange rates (ECB reference rates via Frankfurter API).
